<title>[TASK]</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --void-0:#080b1c;
    --void-1:#0e1330;
    --void-2:#161c42;
    --void-3:#1f2752;
    --line:rgba(148,163,224,0.18);
    --ink-1:#eef1ff;
    --ink-2:#aab2dd;
    --ink-3:#6b73a3;
    --amethyst:#b48cff;
    --amethyst-deep:#7c4dff;
    --sapphire:#5ec8ff;
    --sapphire-deep:#2a7de1;
    --emerald:#49e6b8;
    --emerald-deep:#12b891;
    --gold:#ffd27a;
    --danger:#ff6b8b;
    --font-display:'Gowun Batang','Nanum Myeongjo',Georgia,serif;
    --font-body:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --font-mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ min-height:100%; }
  body{
    margin:0;
    background:var(--void-1);
    color:var(--ink-1);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.55;
    padding-bottom:40px;
    -webkit-font-smoothing:antialiased;
  }
  button, input, a{ -webkit-tap-highlight-color:transparent; font-family:inherit; }
  :focus-visible{ outline:2px solid var(--sapphire); outline-offset:2px; }

  /* ---------- cosmos background ---------- */
  .cosmos{
    position:fixed; inset:0; z-index:-1; overflow:hidden;
    background:
      radial-gradient(ellipse 80% 60% at 20% -10%, rgba(124,77,255,0.18), transparent 60%),
      radial-gradient(ellipse 70% 55% at 100% 10%, rgba(42,125,225,0.16), transparent 55%),
      radial-gradient(ellipse 60% 50% at 50% 120%, rgba(18,184,145,0.12), transparent 60%),
      linear-gradient(180deg, var(--void-0), var(--void-1) 42%, var(--void-0));
  }
  .cosmos::before, .cosmos::after{
    content:""; position:absolute; width:60vmax; height:60vmax; border-radius:50%;
    filter:blur(90px); opacity:.32;
  }
  .cosmos::before{ background:var(--amethyst-deep); top:-22%; left:-16%; animation:drift1 46s ease-in-out infinite alternate; }
  .cosmos::after{ background:var(--sapphire-deep); bottom:-26%; right:-16%; animation:drift2 52s ease-in-out infinite alternate; }
  @keyframes drift1{ from{ transform:translate(0,0); } to{ transform:translate(4%,6%); } }
  @keyframes drift2{ from{ transform:translate(0,0); } to{ transform:translate(-5%,-4%); } }
  .star{
    position:absolute; background:#fff; border-radius:50%;
    box-shadow:0 0 4px 1px rgba(255,255,255,0.55);
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.22; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.15); } }
  @keyframes pulse-soft{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }
  @media (prefers-reduced-motion: reduce){
    .cosmos::before, .cosmos::after, .star{ animation:none; }
    .ddaybadge.overdue, .tl-marker.overdue{ animation:none; }
  }

  /* ---------- level color tokens ---------- */
  .lvl-high{ --lvl:var(--amethyst); --lvl-deep:var(--amethyst-deep); --lvl-soft:rgba(180,140,255,0.16); }
  .lvl-mid{ --lvl:var(--sapphire); --lvl-deep:var(--sapphire-deep); --lvl-soft:rgba(94,200,255,0.16); }
  .lvl-low{ --lvl:var(--emerald); --lvl-deep:var(--emerald-deep); --lvl-soft:rgba(73,230,184,0.16); }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px 60px; }

  /* ---------- hero ---------- */
  .hero{ text-align:center; padding:48px 16px 30px; }
  .hero-badge{ font-size:26px; color:var(--amethyst); text-shadow:0 0 18px rgba(180,140,255,.65); margin-bottom:10px; }
  .hero h1{
    font-family:var(--font-display); font-weight:700; margin:0 0 10px;
    font-size:clamp(28px,5vw,40px); color:var(--ink-1); text-wrap:balance; letter-spacing:.01em;
  }
  .hero-sub{ margin:0; color:var(--ink-2); font-size:15px; }

  /* ---------- panels ---------- */
  .panel{
    position:relative; margin-bottom:22px;
    background:linear-gradient(155deg, rgba(31,39,82,0.72), rgba(14,19,48,0.5));
    border:1px solid var(--line); border-radius:22px; padding:22px;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 20px 50px -25px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .panel h2{ font-family:var(--font-display); font-size:19px; font-weight:700; color:var(--ink-1); margin:0 0 16px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .panel-head h2{ margin:0; }

  .add-panel-body{ display:flex; flex-direction:column; gap:16px; }
  .field label{ display:block; font-size:13.5px; font-weight:600; color:var(--ink-2); margin-bottom:6px; letter-spacing:.02em; }
  .field label .opt{ color:var(--ink-3); font-weight:500; }
  .field input[type="text"], .field input[type="date"], .field input[type="time"], .field select{
    width:100%; padding:12px 14px; font-size:16px;
    background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.14); border-radius:12px;
    color:var(--ink-1); outline:none; cursor:pointer; color-scheme:dark;
  }
  .field input[type="text"]{ cursor:text; }
  .field input::placeholder{ color:var(--ink-3); }
  .field input:focus, .field select:focus{ border-color:var(--sapphire); box-shadow:0 0 0 3px rgba(94,200,255,0.16); }
  .field select option{ background:var(--void-2); color:var(--gold); }
  .field select option:checked, .field select option:hover{ background:var(--void-3); color:var(--gold); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .field-row{ grid-template-columns:1fr; } }
  .repeat-hint{ margin:-6px 0 0; font-size:12.5px; color:var(--ink-3); }
  .time-select{ display:flex; align-items:center; gap:6px; }
  .time-select select{ flex:1; min-width:0; }
  .time-sep{ color:var(--ink-3); font-weight:700; }

  .level-buttons{ display:flex; gap:8px; }
  .level-buttons button{
    flex:1; padding:12px 0; font-weight:700; font-size:15px;
    border-radius:12px; border:1.5px solid rgba(255,255,255,0.14); cursor:pointer;
    background:rgba(255,255,255,0.04); color:var(--ink-2);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .level-buttons button[data-level="상"]{ --lvl:var(--amethyst); --lvl-soft:rgba(180,140,255,0.18); }
  .level-buttons button[data-level="중"]{ --lvl:var(--sapphire); --lvl-soft:rgba(94,200,255,0.18); }
  .level-buttons button[data-level="하"]{ --lvl:var(--emerald); --lvl-soft:rgba(73,230,184,0.18); }
  .level-buttons button:hover{ border-color:var(--lvl); color:var(--ink-1); }
  .level-buttons button.selected{
    background:var(--lvl-soft); border-color:var(--lvl); color:var(--ink-1);
    box-shadow:0 0 0 3px rgba(255,255,255,0.04) inset, 0 0 16px -4px var(--lvl);
  }

  .add-btn{
    width:100%; padding:15px 0; font-weight:700; font-size:16px; color:var(--void-0);
    background:linear-gradient(120deg, var(--amethyst), var(--sapphire)); border:none; border-radius:14px; cursor:pointer;
    box-shadow:0 12px 24px -12px rgba(124,77,255,0.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .add-btn:hover{ transform:translateY(-1px); box-shadow:0 16px 28px -12px rgba(124,77,255,0.65); }
  .add-btn:active{ transform:translateY(0); }

  .copy-btn{
    background:rgba(255,255,255,0.06); color:var(--ink-1); border:1.5px solid rgba(255,255,255,0.18);
    border-radius:12px; padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .copy-btn:hover{ border-color:var(--sapphire); color:var(--sapphire); }
  .toolbar-inline{ display:flex; gap:8px; flex-wrap:wrap; }
  .clear-btn{
    background:rgba(255,107,139,0.08); color:var(--danger); border:1.5px solid rgba(255,107,139,0.32);
    border-radius:12px; padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .clear-btn:hover{ background:rgba(255,107,139,0.16); border-color:var(--danger); }

  .msg{ font-size:14px; font-weight:600; border-radius:12px; padding:10px 12px; display:none; }
  .msg.show{ display:block; }
  .msg.error{ background:rgba(255,107,139,0.14); color:#ffb0c2; }
  .msg.success{ background:rgba(73,230,184,0.14); color:#8ff5da; }
  .msg.warn{ background:rgba(255,210,122,0.14); color:#ffd27a; }

  /* ---------- timeline ---------- */
  .timeline{ display:grid; grid-template-columns:56px 1fr; align-items:center; row-gap:20px; column-gap:10px; padding:6px 2px 0; }
  .tl-label{ display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-weight:600; font-size:13px; color:var(--lvl); }
  .tl-track{
    position:relative; height:52px; border-radius:999px;
    background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.05));
  }
  .tl-track::before{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(255,255,255,.14); }
  .tl-today{
    position:absolute; left:0; top:-10px; bottom:-10px; width:2px;
    background:linear-gradient(var(--gold), transparent 85%);
    box-shadow:0 0 8px rgba(255,210,122,.6);
  }
  .tl-marker{
    position:absolute; top:50%; width:13px; height:13px; background:var(--lvl);
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
    box-shadow:0 0 10px 1px var(--lvl);
    transform:translate(-50%, calc(-50% - var(--lane,0) * 16px));
    cursor:pointer;
  }
  .tl-marker:hover{ filter:brightness(1.25); }
  .tl-marker.done{ background:var(--ink-3); box-shadow:none; opacity:.5; }
  .tl-marker.overdue{ background:var(--danger); box-shadow:0 0 12px 2px var(--danger); animation:pulse-soft 1.8s ease-in-out infinite; }
  .tl-axis{ position:relative; height:18px; margin-top:2px; }
  .tl-tick{ position:absolute; top:0; font-family:var(--font-mono); font-size:11px; color:var(--ink-3); white-space:nowrap; }
  .tl-caption{ grid-column:1/-1; margin-top:6px; font-size:12.5px; color:var(--ink-3); text-align:center; }

  /* ---------- board ---------- */
  .board{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:22px; }
  @media (max-width:760px){ .board{ grid-template-columns:1fr; } }
  .col{
    display:flex; flex-direction:column; gap:14px;
    background:linear-gradient(160deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
    border:1px solid var(--line); border-radius:20px; padding:16px; min-height:150px;
  }
  .col h2{
    display:flex; align-items:center; justify-content:center; gap:8px; margin:0;
    font-family:var(--font-display); font-size:17px; font-weight:700; padding:9px 0;
    border-radius:12px; background:var(--lvl-soft); color:var(--lvl);
  }
  .col h2 em{ font-style:normal; font-family:var(--font-mono); font-size:13px; opacity:.85; }
  .gem-dot{
    width:9px; height:9px; background:var(--lvl); flex-shrink:0;
    clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); box-shadow:0 0 8px var(--lvl); display:inline-block;
  }
  .list{ display:flex; flex-direction:column; gap:10px; }
  .empty{ text-align:center; color:var(--ink-3); font-size:14px; padding:26px 10px; }

  .item{
    position:relative; display:flex; align-items:flex-start; gap:10px;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.08); border-left:3px solid var(--lvl);
    border-radius:14px; padding:12px 14px;
    box-shadow:0 10px 24px -18px rgba(0,0,0,0.7);
    transition:opacity .25s ease, filter .25s ease, transform .2s ease;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  }
  .item:hover{ transform:translateY(-1px); }
  .item.done{ opacity:.5; filter:grayscale(.85); border-left-color:var(--ink-3); }
  .item.done .item-text{ text-decoration:line-through; text-decoration-color:var(--ink-3); }

  .check{ position:relative; width:22px; height:22px; flex-shrink:0; margin-top:2px; cursor:pointer; }
  .check input{ position:absolute; inset:0; opacity:0; margin:0; width:100%; height:100%; cursor:pointer; }
  .gem-check{
    position:absolute; inset:2px; background:rgba(255,255,255,0.06); border:2px solid var(--lvl);
    transform:rotate(45deg); border-radius:3px; transition:background .2s ease, box-shadow .2s ease;
  }
  .check input:checked ~ .gem-check{ background:var(--lvl); box-shadow:0 0 14px 1px var(--lvl); }
  .check input:focus-visible ~ .gem-check{ outline:2px solid var(--ink-1); outline-offset:3px; }
  .check input:checked ~ .gem-check::after{ content:""; position:absolute; inset:5px; background:var(--void-0); border-radius:1px; opacity:.25; }

  .item-body{ flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .item-text{ word-break:break-word; font-weight:600; font-size:15.5px; color:var(--ink-1); }

  .ddaybadge{
    align-self:flex-start; font-family:var(--font-mono); font-size:12px; font-weight:600;
    padding:2px 8px; border-radius:8px; letter-spacing:.02em; white-space:nowrap;
    background:rgba(255,255,255,0.08); color:var(--ink-2);
  }
  .ddaybadge.today{ background:rgba(255,210,122,0.18); color:var(--gold); }
  .ddaybadge.overdue{ background:rgba(255,107,139,0.16); color:var(--danger); animation:pulse-soft 2s ease-in-out infinite; }
  .ddaybadge.done{ background:rgba(255,255,255,0.06); color:var(--ink-3); }

  .repeat-tag{
    align-self:flex-start; font-size:11.5px; font-weight:600; color:var(--ink-2);
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    padding:2px 8px; border-radius:8px; letter-spacing:.02em;
  }

  .del-btn{
    border:none; background:transparent; color:var(--ink-3); font-size:16px; line-height:1;
    cursor:pointer; padding:5px 7px; border-radius:8px; flex-shrink:0;
  }
  .del-btn:hover{ background:rgba(255,107,139,0.12); color:var(--danger); }

  /* ---------- calendar ---------- */
  .calendar-panel h2{ text-align:center; }
  .cal-nav{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:16px; }
  .cal-arrow{
    width:36px; height:36px; flex-shrink:0; border-radius:50%; border:1.5px solid rgba(255,255,255,0.16);
    background:rgba(255,255,255,0.05); color:var(--ink-1); font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-arrow:hover{ border-color:var(--sapphire); color:var(--sapphire); }
  .cal-title-wrap{ display:flex; flex-direction:column; align-items:center; gap:2px; min-width:130px; }
  .cal-title{ font-family:var(--font-display); font-size:18px; font-weight:700; color:var(--ink-1); text-align:center; }
  .cal-today-btn{
    background:none; border:none; color:var(--ink-3); font-size:11.5px; font-weight:700;
    cursor:pointer; padding:2px 8px; border-radius:6px; letter-spacing:.02em;
  }
  .cal-today-btn:hover{ color:var(--sapphire); background:rgba(94,200,255,0.1); }

  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .cal-weekdays span{ text-align:center; font-size:12px; font-weight:700; color:var(--ink-3); padding:2px 0; }
  .cal-weekdays span.sun{ color:var(--danger); }
  .cal-weekdays span.sat{ color:var(--sapphire); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:stretch; }
  .cal-cell{
    position:relative; min-height:64px; border-radius:12px; font-family:inherit;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
    padding:4px 3px; display:flex; flex-direction:column; align-items:stretch; gap:2px;
    cursor:pointer; color:var(--ink-1);
  }
  .cal-cell:hover{ border-color:var(--sapphire); }
  .cal-cell.muted{ opacity:.32; }
  .cal-cell.today{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset, 0 0 14px -4px var(--gold); }
  .cal-cell.selected{ border-color:var(--amethyst); background:rgba(180,140,255,0.14); }
  .cal-daynum{ align-self:center; font-family:var(--font-mono); font-size:12.5px; font-weight:600; }
  .cal-cell.holiday .cal-daynum{ color:var(--danger); font-weight:800; }
  .cal-tasks{ display:flex; flex-direction:column; gap:1px; width:100%; min-width:0; }
  .cal-task-chip{ display:flex; align-items:center; gap:3px; min-width:0; font-size:9.5px; font-weight:700; line-height:1.25; }
  .cal-chip-dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .cal-chip-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .cal-chip-high{ color:var(--amethyst); }
  .cal-chip-mid{ color:var(--sapphire); }
  .cal-chip-low{ color:var(--emerald); }
  .cal-chip-done{ color:var(--ink-3); }
  .cal-chip-done .cal-chip-text{ text-decoration:line-through; }
  .cal-dot-high{ background:var(--amethyst); box-shadow:0 0 4px var(--amethyst); }
  .cal-dot-mid{ background:var(--sapphire); box-shadow:0 0 4px var(--sapphire); }
  .cal-dot-low{ background:var(--emerald); box-shadow:0 0 4px var(--emerald); }
  .cal-dot-done{ background:var(--ink-3); box-shadow:none; opacity:.6; }
  .cal-more{ font-family:var(--font-mono); font-size:8.5px; color:var(--ink-3); }

  @media (max-width:520px){
    .cal-grid, .cal-weekdays{ gap:4px; }
    .cal-cell{ border-radius:9px; padding:3px 2px; min-height:56px; }
    .cal-daynum{ font-size:11px; }
    .cal-task-chip{ font-size:8.5px; }
    .cal-chip-dot{ width:4px; height:4px; }
  }

  .cal-detail{ margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
  .cal-detail-title{ font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--ink-2); margin-bottom:10px; letter-spacing:.02em; }
  .cal-holiday-banner{
    display:inline-block; margin:0 0 12px; font-size:12px; font-weight:700; color:var(--danger);
    background:rgba(255,107,139,0.12); border:1px solid rgba(255,107,139,0.28);
    padding:3px 10px; border-radius:8px; letter-spacing:.02em;
  }
</style>

<div class="cosmos" id="cosmos" aria-hidden="true"></div>

<div class="wrap">
  <header class="hero">
    <div class="hero-badge" aria-hidden="true">◈</div>
    <h1>[TASK]</h1>
    <p class="hero-sub">마감일과 중요도로, 오늘의 할 일을 은하수처럼 정렬해보세요.</p>
  </header>

  <section class="panel add-panel" aria-labelledby="add-heading">
    <h2 id="add-heading">새 일정 추가</h2>
    <div class="add-panel-body">
      <div class="field">
        <label for="todoInput">할 일</label>
        <input type="text" id="todoInput" placeholder="예) 3분기 실적 보고서 제출" maxlength="200" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="deadlineInput">마감일 <span class="opt">(선택)</span></label>
          <input type="date" id="deadlineInput">
        </div>
        <div class="field">
          <label id="timeLabel">마감 시간 <span class="opt">(선택)</span></label>
          <div class="time-select" role="group" aria-labelledby="timeLabel">
            <select id="timeHour" aria-label="시"><option value="">시</option></select>
            <span class="time-sep" aria-hidden="true">:</span>
            <select id="timeMinute" aria-label="분"><option value="">분</option></select>
          </div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label id="levelLabel">중요도</label>
          <div class="level-buttons" role="group" aria-labelledby="levelLabel">
            <button type="button" data-level="상" aria-pressed="false">상</button>
            <button type="button" data-level="중" aria-pressed="false">중</button>
            <button type="button" data-level="하" aria-pressed="false">하</button>
          </div>
        </div>
        <div class="field">
          <label for="repeatInput">반복</label>
          <select id="repeatInput">
            <option value="안함">반복 안 함</option>
            <option value="매일">매일</option>
            <option value="매주">매주</option>
            <option value="매월">매월</option>
          </select>
        </div>
      </div>
      <p class="repeat-hint" id="repeatHint">반복을 선택하면 마감일을 시작일로 자동 생성돼요 · 매일 14회 · 매주 8회 · 매월 6회</p>
      <button class="add-btn" id="addBtn" type="button">별자리에 추가하기</button>
      <div class="msg" id="msgBox" role="status"></div>
    </div>
  </section>

  <section class="panel timeline-panel" aria-labelledby="timeline-heading">
    <div class="panel-head">
      <h2 id="timeline-heading">마감 타임라인</h2>
      <div class="toolbar-inline">
        <button class="copy-btn" id="copyBtn" type="button">결과 복사하기</button>
        <button class="clear-btn" id="clearAllBtn" type="button">전체 삭제</button>
      </div>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <section class="board" id="board">
    <div class="col lvl-high" data-level="상">
      <h2><span class="gem-dot" aria-hidden="true"></span>상<em id="count-상">0</em></h2>
      <div class="list" id="list-상"></div>
    </div>
    <div class="col lvl-mid" data-level="중">
      <h2><span class="gem-dot" aria-hidden="true"></span>중<em id="count-중">0</em></h2>
      <div class="list" id="list-중"></div>
    </div>
    <div class="col lvl-low" data-level="하">
      <h2><span class="gem-dot" aria-hidden="true"></span>하<em id="count-하">0</em></h2>
      <div class="list" id="list-하"></div>
    </div>
  </section>

  <section class="panel calendar-panel" aria-labelledby="calendar-heading">
    <h2 id="calendar-heading">캘린더</h2>
    <div class="cal-nav">
      <button class="cal-arrow" id="calPrev" type="button" aria-label="이전 달">‹</button>
      <div class="cal-title-wrap">
        <div class="cal-title" id="calTitle">–</div>
        <button class="cal-today-btn" id="calToday" type="button">오늘</button>
      </div>
      <button class="cal-arrow" id="calNext" type="button" aria-label="다음 달">›</button>
    </div>
    <div class="cal-weekdays" id="calWeekdays"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-detail" id="calDetail"></div>
  </section>
</div>

<script>
(function(){
  var LOCAL_KEY = 'starlight_priority_tasks_v1';
  var tasksCache = [];
  var selectedLevel = null;
  var storageAvailable = true;
  var calYear, calMonth, selectedDate;

  /* ---------- helpers ---------- */
  function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function addDays(d,n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function addMonthsClamped(d,n){
    var target = new Date(d.getFullYear(), d.getMonth()+n, 1);
    var lastDay = new Date(target.getFullYear(), target.getMonth()+1, 0).getDate();
    target.setDate(Math.min(d.getDate(), lastDay));
    return target;
  }
  function diffDays(a,b){ return Math.round((b-a)/86400000); }
  function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
  function levelClass(lv){ return lv === '상' ? 'high' : (lv === '중' ? 'mid' : 'low'); }
  function toISODate(d){
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth()+1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }
  function occurrenceDates(startIso, repeat){
    var base = startOfDay(new Date(startIso + 'T00:00:00'));
    var dates = [];
    if(repeat === '매일'){
      for(var i = 0; i < 14; i++) dates.push(addDays(base, i));
    }else if(repeat === '매주'){
      for(var i = 0; i < 8; i++) dates.push(addDays(base, i * 7));
    }else if(repeat === '매월'){
      for(var i = 0; i < 6; i++) dates.push(addMonthsClamped(base, i));
    }else{
      dates.push(base);
    }
    return dates;
  }
  function formatDateShort(iso){
    var d = new Date(iso + 'T00:00:00');
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function formatDday(offset, done){
    if(done) return '완료';
    if(offset === 0) return 'D-DAY';
    if(offset > 0) return 'D-' + offset;
    return 'D+' + Math.abs(offset);
  }
  function ddayClass(offset, done){
    if(done) return 'done';
    if(offset < 0) return 'overdue';
    if(offset === 0) return 'today';
    return '';
  }

  /* ---------- Korean public holidays ---------- */
  /* Fixed solar-date holidays, computed for any year. "since" marks the
     year the substitute-holiday (대체공휴일) rule started applying to it;
     신정·현충일 are never substitute-eligible. */
  var FIXED_HOLIDAYS = [
    { md:'01-01', name:'신정',   sub:false },
    { md:'03-01', name:'삼일절', sub:true,  since:2021 },
    { md:'05-05', name:'어린이날', sub:true, since:2014 },
    { md:'06-06', name:'현충일', sub:false },
    { md:'08-15', name:'광복절', sub:true,  since:2021 },
    { md:'10-03', name:'개천절', sub:true,  since:2021 },
    { md:'10-09', name:'한글날', sub:true,  since:2021 },
    { md:'12-25', name:'크리스마스', sub:true, since:2023 }
  ];

  /* Lunar-calendar holidays (설날, 추석, 부처님오신날) and their already-
     resolved substitute days can't be derived algorithmically, so they're
     listed per year from the official government calendar. Covers the
     years this planner is most likely to actually be used for. */
  var LUNAR_HOLIDAYS = {
    2024: [
      ['2024-02-09','설날 연휴'], ['2024-02-10','설날'], ['2024-02-11','설날 연휴'], ['2024-02-12','대체공휴일(설날)'],
      ['2024-05-15','부처님오신날'],
      ['2024-09-16','추석 연휴'], ['2024-09-17','추석'], ['2024-09-18','추석 연휴']
    ],
    2025: [
      ['2025-01-28','설날 연휴'], ['2025-01-29','설날'], ['2025-01-30','설날 연휴'],
      ['2025-05-05','부처님오신날'], ['2025-05-06','대체공휴일(어린이날·부처님오신날)'],
      ['2025-10-05','추석 연휴'], ['2025-10-06','추석'], ['2025-10-07','추석 연휴'], ['2025-10-08','대체공휴일(추석)']
    ],
    2026: [
      ['2026-02-16','설날 연휴'], ['2026-02-17','설날'], ['2026-02-18','설날 연휴'],
      ['2026-09-24','추석 연휴'], ['2026-09-25','추석'], ['2026-09-26','추석 연휴']
    ]
  };

  var holidayCache = {};
  function getHolidayMap(year){
    if(holidayCache[year]) return holidayCache[year];
    var map = {};
    var used = {};
    function add(iso, name){
      if(!map[iso]) map[iso] = [];
      if(map[iso].indexOf(name) === -1) map[iso].push(name);
      used[iso] = true;
    }

    (LUNAR_HOLIDAYS[year] || []).forEach(function(pair){ add(pair[0], pair[1]); });

    FIXED_HOLIDAYS.forEach(function(h){ add(year + '-' + h.md, h.name); });

    FIXED_HOLIDAYS.forEach(function(h){
      if(!h.sub || year < (h.since || 0)) return;
      var base = new Date((year + '-' + h.md) + 'T00:00:00');
      var cursor = addDays(base, 1);
      while(cursor.getDay() === 0 || cursor.getDay() === 6 || used[toISODate(cursor)]){
        cursor = addDays(cursor, 1);
      }
      add(toISODate(cursor), '대체공휴일(' + h.name + ')');
    });

    holidayCache[year] = map;
    return map;
  }

  /* ---------- local storage ---------- */
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      tasksCache = raw ? JSON.parse(raw) : [];
    }catch(e){ storageAvailable = false; tasksCache = []; }
  }
  function saveLocal(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(tasksCache)); }catch(e){ storageAvailable = false; }
  }

  /* ---------- data operations ---------- */
  function addTask(task){
    task.id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    tasksCache.push(task);
    saveLocal();
    renderAll();
  }
  function toggleDone(id, done){
    var t = tasksCache.filter(function(x){ return x.id === id; })[0];
    if(t){ t.done = done; saveLocal(); renderAll(); }
  }
  function deleteTask(id){
    tasksCache = tasksCache.filter(function(x){ return x.id !== id; });
    saveLocal();
    renderAll();
  }

  /* ---------- messages ---------- */
  function showMsg(text, type){
    var box = document.getElementById('msgBox');
    box.textContent = text;
    box.className = 'msg show ' + type;
  }
  function hideMsg(){
    document.getElementById('msgBox').className = 'msg';
  }

  /* ---------- rendering ---------- */
  function renderAll(){
    renderColumns();
    renderTimeline();
    renderCalendar();
  }

  function buildItem(t, level){
    var row = document.createElement('div');
    row.className = 'item lvl-' + levelClass(level) + (t.done ? ' done' : '');

    var label = document.createElement('label');
    label.className = 'check';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!t.done;
    cb.id = 'chk-' + t.id;
    cb.setAttribute('aria-label', (t.done ? '완료 해제: ' : '완료로 표시: ') + t.text);
    cb.addEventListener('change', function(){ toggleDone(t.id, cb.checked); });
    var gem = document.createElement('span');
    gem.className = 'gem-check';
    gem.setAttribute('aria-hidden', 'true');
    label.appendChild(cb);
    label.appendChild(gem);

    var body = document.createElement('div');
    body.className = 'item-body';
    var text = document.createElement('div');
    text.className = 'item-text';
    text.textContent = t.text;
    body.appendChild(text);

    if(t.deadline){
      var offset = diffDays(startOfDay(new Date()), startOfDay(new Date(t.deadline + 'T00:00:00')));
      var badge = document.createElement('span');
      badge.className = 'ddaybadge ' + ddayClass(offset, t.done);
      var dateLabel = formatDateShort(t.deadline) + (t.time ? ' ' + t.time : '');
      badge.textContent = formatDday(offset, t.done) + (t.done ? '' : ' · ' + dateLabel);
      body.appendChild(badge);
    }

    if(t.repeatRule){
      var rep = document.createElement('span');
      rep.className = 'repeat-tag';
      rep.textContent = '↻ ' + t.repeatRule;
      body.appendChild(rep);
    }

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del-btn';
    del.setAttribute('aria-label', '삭제: ' + t.text);
    del.textContent = '×';
    del.addEventListener('click', function(){ deleteTask(t.id); });

    row.appendChild(label);
    row.appendChild(body);
    row.appendChild(del);
    return row;
  }

  function sortForColumn(a, b){
    if(a.done !== b.done) return a.done ? 1 : -1;
    var da = a.deadline ? new Date(a.deadline) : null;
    var dbb = b.deadline ? new Date(b.deadline) : null;
    if(da && dbb) return da - dbb;
    if(da) return -1;
    if(dbb) return 1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  }

  var LEVEL_ORDER = { '상':0, '중':1, '하':2 };
  function sortByLevel(a, b){
    var lv = LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level];
    if(lv !== 0) return lv;
    if(a.done !== b.done) return a.done ? 1 : -1;
    var ta = a.time || '99:99';
    var tb = b.time || '99:99';
    if(ta !== tb) return ta < tb ? -1 : 1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  }

  function clearAllTasks(){
    if(tasksCache.length === 0){
      showMsg('삭제할 일정이 없어요.', 'warn');
      return;
    }
    var ok = window.confirm('모든 일정을 삭제할까요? 이 작업은 되돌릴 수 없어요.');
    if(!ok) return;
    tasksCache = [];
    saveLocal();
    renderAll();
    showMsg('모든 일정을 삭제했어요.', 'success');
  }

  function renderColumns(){
    ['상','중','하'].forEach(function(level){
      var wrap = document.getElementById('list-' + level);
      wrap.innerHTML = '';
      var group = tasksCache.filter(function(t){ return t.level === level; });
      document.getElementById('count-' + level).textContent = group.length;
      if(group.length === 0){
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '아직 별이 없어요. 첫 일정을 추가해보세요.';
        wrap.appendChild(empty);
        return;
      }
      group.slice().sort(sortForColumn).forEach(function(t){
        wrap.appendChild(buildItem(t, level));
      });
    });
  }

  function renderTimeline(){
    var el = document.getElementById('timeline');
    el.innerHTML = '';
    var levels = ['상','중','하'];
    var today = startOfDay(new Date());
    var dated = tasksCache.filter(function(t){ return !!t.deadline; });

    var spanDays = 7;
    if(dated.length){
      var maxOffset = 0;
      dated.forEach(function(t){
        var off = diffDays(today, startOfDay(new Date(t.deadline + 'T00:00:00')));
        if(off > maxOffset) maxOffset = off;
      });
      spanDays = Math.max(7, maxOffset + 1);
    }

    levels.forEach(function(lv){
      var label = document.createElement('div');
      label.className = 'tl-label lvl-' + levelClass(lv);
      var dot = document.createElement('span');
      dot.className = 'gem-dot';
      dot.setAttribute('aria-hidden', 'true');
      var txt = document.createElement('span');
      txt.textContent = lv;
      label.appendChild(dot);
      label.appendChild(txt);

      var track = document.createElement('div');
      track.className = 'tl-track lvl-' + levelClass(lv);

      var todayLine = document.createElement('div');
      todayLine.className = 'tl-today';
      track.appendChild(todayLine);

      var group = dated.filter(function(t){ return t.level === lv; })
        .sort(function(a,b){ return new Date(a.deadline) - new Date(b.deadline); });

      var laneEnds = [];
      var laneSeq = [0,1,-1,2,-2];
      group.forEach(function(t){
        var offset = diffDays(today, startOfDay(new Date(t.deadline + 'T00:00:00')));
        var pct = clamp(offset / spanDays, 0, 1) * 100;
        var laneIdx = laneSeq.length - 1;
        for(var i = 0; i < laneSeq.length; i++){
          if(laneEnds[i] === undefined || (pct - laneEnds[i]) > 6){ laneIdx = i; laneEnds[i] = pct; break; }
        }
        var marker = document.createElement('div');
        var overdue = !t.done && offset < 0;
        marker.className = 'tl-marker' + (t.done ? ' done' : '') + (overdue ? ' overdue' : '');
        marker.style.left = pct + '%';
        marker.style.setProperty('--lane', laneSeq[laneIdx]);
        marker.tabIndex = 0;
        var ddayText = formatDday(offset, t.done);
        var timeText = t.time ? ' ' + t.time : '';
        marker.title = t.text + timeText + ' · ' + ddayText;
        marker.setAttribute('aria-label', t.text + timeText + ', ' + ddayText);
        track.appendChild(marker);
      });

      el.appendChild(label);
      el.appendChild(track);
    });

    var axisSpacer = document.createElement('div');
    var axis = document.createElement('div');
    axis.className = 'tl-axis';
    var tickCount = 5;
    for(var i = 0; i <= tickCount; i++){
      var dayOffset = Math.round(spanDays * i / tickCount);
      var d = addDays(today, dayOffset);
      var tick = document.createElement('div');
      tick.className = 'tl-tick';
      tick.style.left = (dayOffset / spanDays * 100) + '%';
      tick.style.transform = i === 0 ? 'translateX(0)' : (i === tickCount ? 'translateX(-100%)' : 'translateX(-50%)');
      tick.textContent = dayOffset === 0 ? '오늘' : ((d.getMonth()+1) + '/' + d.getDate());
      axis.appendChild(tick);
    }
    el.appendChild(axisSpacer);
    el.appendChild(axis);

    var note = document.createElement('div');
    note.className = 'tl-caption';
    note.textContent = dated.length
      ? '마감이 가까울수록 오른쪽으로 이동해요 · 지난 마감은 붉게 반짝여요.'
      : '예정된 마감일이 없어요. 마감일을 추가하면 이곳에 별처럼 나타나요.';
    el.appendChild(note);
  }

  /* ---------- calendar ---------- */
  function renderCalendar(){
    if(calYear === undefined){
      var now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      selectedDate = toISODate(now);
    }

    document.getElementById('calTitle').textContent = calYear + '년 ' + (calMonth + 1) + '월';

    var weekdaysEl = document.getElementById('calWeekdays');
    if(!weekdaysEl.childElementCount){
      ['일','월','화','수','목','금','토'].forEach(function(w, idx){
        var span = document.createElement('span');
        span.textContent = w;
        if(idx === 0) span.className = 'sun';
        if(idx === 6) span.className = 'sat';
        weekdaysEl.appendChild(span);
      });
    }

    var selDate = new Date(selectedDate + 'T00:00:00');
    if(selDate.getFullYear() !== calYear || selDate.getMonth() !== calMonth){
      selectedDate = toISODate(new Date(calYear, calMonth, 1));
    }

    var gridEl = document.getElementById('calGrid');
    gridEl.innerHTML = '';

    var startWeekday = new Date(calYear, calMonth, 1).getDay();
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    var totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
    var todayIso = toISODate(new Date());

    for(var i = 0; i < totalCells; i++){
      var cellDate = new Date(calYear, calMonth, 1 - startWeekday + i);
      var iso = toISODate(cellDate);
      var muted = cellDate.getMonth() !== calMonth;
      var holidayNames = getHolidayMap(cellDate.getFullYear())[iso];

      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-cell'
        + (muted ? ' muted' : '')
        + (iso === todayIso ? ' today' : '')
        + (iso === selectedDate ? ' selected' : '')
        + (holidayNames ? ' holiday' : '');
      cell.setAttribute('data-date', iso);

      var num = document.createElement('div');
      num.className = 'cal-daynum';
      num.textContent = cellDate.getDate();
      cell.appendChild(num);

      var dayTasks = tasksCache.filter(function(t){ return t.deadline === iso; }).sort(sortByLevel);
      if(dayTasks.length){
        var tasksWrap = document.createElement('div');
        tasksWrap.className = 'cal-tasks';
        dayTasks.slice(0,2).forEach(function(t){
          var lvlCls = t.done ? 'done' : levelClass(t.level);
          var chip = document.createElement('div');
          chip.className = 'cal-task-chip cal-chip-' + lvlCls;
          var dot = document.createElement('span');
          dot.className = 'cal-chip-dot cal-dot-' + lvlCls;
          var txt = document.createElement('span');
          txt.className = 'cal-chip-text';
          txt.textContent = t.text;
          chip.appendChild(dot);
          chip.appendChild(txt);
          tasksWrap.appendChild(chip);
        });
        if(dayTasks.length > 2){
          var more = document.createElement('div');
          more.className = 'cal-more';
          more.textContent = '+' + (dayTasks.length - 2) + '개 더';
          tasksWrap.appendChild(more);
        }
        cell.appendChild(tasksWrap);
      }

      cell.setAttribute('aria-label', (cellDate.getMonth()+1) + '월 ' + cellDate.getDate() + '일'
        + (holidayNames ? ', ' + holidayNames.join(', ') : '')
        + (dayTasks.length ? ', 일정 ' + dayTasks.length + '개' : ''));
      cell.addEventListener('click', function(){
        selectedDate = this.getAttribute('data-date');
        renderCalendar();
      });
      gridEl.appendChild(cell);
    }

    renderCalendarDetail();
  }

  function renderCalendarDetail(){
    var detail = document.getElementById('calDetail');
    detail.innerHTML = '';

    var d = new Date(selectedDate + 'T00:00:00');
    var weekdayNames = ['일','월','화','수','목','금','토'];
    var title = document.createElement('div');
    title.className = 'cal-detail-title';
    title.textContent = (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + weekdayNames[d.getDay()] + ')';
    detail.appendChild(title);

    var holidayNames = getHolidayMap(d.getFullYear())[selectedDate];
    if(holidayNames){
      var banner = document.createElement('div');
      banner.className = 'cal-holiday-banner';
      banner.textContent = '공휴일 · ' + holidayNames.join('·');
      detail.appendChild(banner);
    }

    var dayTasks = tasksCache.filter(function(t){ return t.deadline === selectedDate; }).sort(sortByLevel);
    if(dayTasks.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '이 날은 별이 없어요.';
      detail.appendChild(empty);
      return;
    }
    var list = document.createElement('div');
    list.className = 'list';
    dayTasks.forEach(function(t){
      list.appendChild(buildItem(t, t.level));
    });
    detail.appendChild(list);
  }

  /* ---------- copy to clipboard ---------- */
  function buildCopyText(){
    var lines = [];
    ['상','중','하'].forEach(function(level){
      lines.push('[' + level + ']');
      var group = tasksCache.filter(function(t){ return t.level === level; }).slice().sort(sortForColumn);
      if(group.length === 0){
        lines.push('- 없음');
      }else{
        group.forEach(function(t){
          var status = t.done ? '(완료) ' : '';
          var dd = t.deadline ? ' (마감 ' + formatDateShort(t.deadline) + (t.time ? ' ' + t.time : '') + ')' : '';
          var rep = t.repeatRule ? ' [반복:' + t.repeatRule + ']' : '';
          lines.push('- ' + status + t.text + dd + rep);
        });
      }
      lines.push('');
    });
    return lines.join('\n').trim();
  }

  function copyResults(){
    var text = buildCopyText();

    function fallbackCopy(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){
          showMsg('복사했어요. 문서에 Ctrl+V로 붙여넣으면 됩니다.', 'success');
        }else{
          throw new Error('execCommand failed');
        }
      }catch(e){
        showMsg('복사에 실패했어요. 목록 텍스트를 직접 선택한 뒤 Ctrl+C로 복사해주세요.', 'error');
      }
    }

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showMsg('복사했어요. 문서에 Ctrl+V로 붙여넣으면 됩니다.', 'success');
      }).catch(fallbackCopy);
    }else{
      fallbackCopy();
    }
  }

  /* ---------- input handling ---------- */
  function populateTimeSelects(){
    var hourSelect = document.getElementById('timeHour');
    for(var h = 0; h < 24; h++){
      var hh = ('0' + h).slice(-2);
      var opt = document.createElement('option');
      opt.value = hh;
      opt.textContent = hh + '시';
      hourSelect.appendChild(opt);
    }
    var minuteSelect = document.getElementById('timeMinute');
    [0,10,20,30,40,50].forEach(function(m){
      var mm = ('0' + m).slice(-2);
      var opt = document.createElement('option');
      opt.value = mm;
      opt.textContent = mm + '분';
      minuteSelect.appendChild(opt);
    });
  }

  function setupLevelButtons(){
    var buttons = document.querySelectorAll('.level-buttons button');
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        selectedLevel = btn.getAttribute('data-level');
        buttons.forEach(function(b){
          b.classList.remove('selected');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('selected');
        btn.setAttribute('aria-pressed', 'true');
        hideMsg();
      });
    });
  }

  function addItem(){
    var input = document.getElementById('todoInput');
    var deadlineInput = document.getElementById('deadlineInput');
    var hourSelect = document.getElementById('timeHour');
    var minuteSelect = document.getElementById('timeMinute');
    var repeatInput = document.getElementById('repeatInput');
    var text = input.value.trim();
    var deadline = deadlineInput.value || null;
    var repeat = repeatInput.value;

    if(text === ''){
      showMsg('할 일을 입력해주세요.', 'error');
      input.focus();
      return;
    }
    if(!selectedLevel){
      showMsg('중요도(상 / 중 / 하)를 선택해주세요.', 'error');
      return;
    }
    if(minuteSelect.value && !hourSelect.value){
      showMsg('마감 시간의 "시"도 선택해주세요.', 'error');
      return;
    }
    var time = hourSelect.value ? (hourSelect.value + ':' + (minuteSelect.value || '00')) : null;
    if(time && !deadline){
      showMsg('마감 시간을 쓰려면 마감일도 선택해주세요.', 'error');
      return;
    }
    if(repeat !== '안함' && !deadline){
      showMsg('반복 일정을 쓰려면 마감일(시작일)을 선택해주세요.', 'error');
      return;
    }

    var dates = deadline ? occurrenceDates(deadline, repeat) : [null];
    var groupId = dates.length > 1 ? ('grp_' + Date.now() + '_' + Math.random().toString(36).slice(2,6)) : null;

    dates.forEach(function(d){
      addTask({
        text: text,
        level: selectedLevel,
        deadline: d ? toISODate(d) : null,
        time: time,
        repeatRule: repeat !== '안함' ? repeat : null,
        repeatGroupId: groupId,
        done: false,
        createdAt: Date.now()
      });
    });

    input.value = '';
    deadlineInput.value = '';
    hourSelect.value = '';
    minuteSelect.value = '';
    repeatInput.value = '안함';
    input.focus();

    if(!storageAvailable){
      showMsg('추가했지만, 이 브라우저에서는 새로고침하면 목록이 사라질 수 있어요.', 'warn');
    }else if(dates.length > 1){
      showMsg('별자리에 ' + dates.length + '개 일정을 추가했어요 (' + repeat + ').', 'success');
    }else{
      showMsg('별자리에 추가했어요.', 'success');
    }
  }

  /* ---------- cosmos background ---------- */
  function initCosmos(){
    var root = document.getElementById('cosmos');
    if(!root) return;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var frag = document.createDocumentFragment();
    var count = 110;
    for(var i = 0; i < count; i++){
      var star = document.createElement('i');
      star.className = 'star';
      var size = (Math.random() * 1.6 + 0.6).toFixed(2);
      star.style.top = (Math.random() * 100) + '%';
      star.style.left = (Math.random() * 100) + '%';
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      if(!reduceMotion){
        star.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + 's';
        star.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      }else{
        star.style.opacity = (0.35 + Math.random() * 0.4).toFixed(2);
      }
      frag.appendChild(star);
    }
    root.appendChild(frag);
  }

  /* ---------- boot ---------- */
  document.getElementById('addBtn').addEventListener('click', addItem);
  document.getElementById('todoInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') addItem();
  });
  document.getElementById('deadlineInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') addItem();
  });
  document.getElementById('copyBtn').addEventListener('click', copyResults);
  document.getElementById('clearAllBtn').addEventListener('click', clearAllTasks);

  document.getElementById('calPrev').addEventListener('click', function(){
    calMonth--;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', function(){
    calMonth++;
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  });
  document.getElementById('calToday').addEventListener('click', function(){
    var now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedDate = toISODate(now);
    renderCalendar();
  });

  populateTimeSelects();
  setupLevelButtons();
  loadLocal();
  renderAll();
  initCosmos();
})();
</script>
